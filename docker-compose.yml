services:
  sniparr:
    image: mrjacobarussell/sniparr:latest
    container_name: sniparr
    network_mode: bridge
    ports:
      - "9705:9705"
    volumes:
      - /mnt/user/appdata/sniparr:/config
    environment:
      - TZ=${TZ:-UTC}
      - BASE_URL=${BASE_URL:-}
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - FRAME_ANCESTORS=${FRAME_ANCESTORS:-*}
      # Optional — reverse proxy / SSO auth:
      # - SNIPARR_AUTH_MODE=proxy
      # - SNIPARR_AUTH_PROXY_HEADER=Remote-User
    labels:
      - "net.unraid.docker.webui=http://[IP]:[PORT:9705]/"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/mrjacobarussell/sniparr/main/frontend/static/logo/256.png"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; import sys; r = requests.get('http://localhost:9705/api/health', timeout=5); sys.exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
